<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
 <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
    <div class="logo">
        <img src="~/images/bonusbasket_logo.png" alt="Bonus Basket Logo" />
        <h1>Stop overpaying for your groceries</h1>
    </div>

    <div class="search-bar">
        <input type="text" placeholder="Enter your shopping list..." />
        <button>Find My Cheapest Basket</button>
    </div>
</div>
 
<section class="features">
    <div class="feature">
        <i class="fa fa-tags"></i>
        <h3>Compare Prices Instantly</h3>
        <p>See which stores give you the best deal.</p>
    </div>
    <div class="feature">
        <i class="fa fa-clock"></i>
        <h3>Save Time & Money</h3>
        <p>No more running from store to store.</p>
    </div>
    <div class="feature">
        <i class="fa fa-candy-cane"></i>
        <h3>Enjoy Bonus Treats</h3>
        <p>Get sweet deals on your favorites.</p>
    </div>
</section>

    
</body>
</html>
